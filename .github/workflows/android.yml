name: Android APK

"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: "نشر APK بإصدار تجريبي جديد للتنزيل"
        type: boolean
        required: true
        default: true
      run_device_probe:
        description: "تشغيل مهمة المحاكي (تجريبية، لا توقف النشر)"
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle"
      - "gradle.properties"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build, test and sign APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Gradle Wrapper
        run: |
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          chmod +x gradlew tools/*.sh

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
          test -f "$ANDROID_HOME/platforms/android-$ANDROID_COMPILE_SDK/android.jar"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

      - name: Run DNS and packet tests
        run: |
          bash tools/test-core.sh | tee "$RUNNER_TEMP/safi-core-tests.txt"

      - name: Compile release APK and run Android Lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:lintRelease

      - name: Sign with the existing app certificate
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: safi
          EXPECTED_CERT_SHA256: 64d348b08d017ea23d9f54b667b7ca4938d93ab7080d19d74b7c75d60a114c99
        run: bash tools/build-ci.sh

      - name: Upload signed APK
        id: apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Safi-Android
          path: release-output/
          if-no-files-found: error
          retention-days: 14
          archive: true

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Safi-test-reports
          path: |
            ${{ runner.temp }}/safi-core-tests.txt
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
          archive: true

      - name: Write build summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## صافي — اكتمل بناء APK داخل GitHub'
            echo
            echo "[تنزيل حزمة APK الموقعة]($ARTIFACT_URL)"
            echo
            echo 'الملف بنفس شهادة توقيع النسخة الأصلية. مصدر البناء موجود في هذا الالتزام:'
            echo "\`$GITHUB_SHA\`"
            echo
            echo 'الاختبارات آلية؛ مهمة المحاكي (إن نجحت) تضيف تحققًا تشغيليًا، لكنها لا تغني عن اختبار هاتفك.'
          } >> "$GITHUB_STEP_SUMMARY"

  device:
    name: Emulator smoke test (DNS filtering)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # New job, not yet validated by a real run. It reports signal but must never block
    # a release until someone reviews its first result and removes this flag.
    continue-on-error: true
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.run_device_probe)
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the APK built by the previous job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Safi-Android
          path: release-output
          digest-mismatch: error

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK tools used by the probe build
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS" "platform-tools"
          chmod +x tools/*.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Safi and run the separate-UID probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # The emulator action runs this through /usr/bin/sh (dash), which rejects
            # `set -o pipefail`; keep only the portable options here.
            set -eu
            APK="$(ls release-output/*.apk | head -n 1)"
            echo "Installing $APK"
            adb install -r "$APK"

            # QA probe: separate application id, throwaway local key, never the release key.
            export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            export ANDROID_BUILD_TOOLS="$ANDROID_BUILD_TOOLS"
            export SAFI_KEYSTORE="$RUNNER_TEMP/probe-signing.jks"
            bash tools/build-device-probe.sh
            adb install -r artifacts/probe/probe.apk

            # Grant VPN consent without the system dialog, then start the service with a
            # visible activity in front (Android restricts background foreground-service starts).
            adb shell appops set app.safi.shield ACTIVATE_VPN allow || true
            adb shell am start -W -n app.safi.shield/.MainActivity
            sleep 5
            adb shell am start-foreground-service -n app.safi.shield/.ShieldVpnService -a app.safi.shield.START
            sleep 20
            adb shell dumpsys activity services app.safi.shield | grep -q ShieldVpnService \
              || { echo 'Safi VPN service did not start:'; adb logcat -d | grep -iE 'safi|vpn' | tail -60; exit 1; }

            adb logcat -c
            adb shell am start -n app.safi.probe/.ProbeActivity
            sleep 45
            adb logcat -d -s SafiProbe:I | tee probe-output.txt
            grep -q 'DEVICE TESTS COMPLETE: 8 passed, 0 failed' probe-output.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Safi-device-probe
          path: |
            probe-output.txt
            artifacts/probe/probe.apk
          if-no-files-found: ignore
          retention-days: 14
          archive: true

      - name: Write device summary
        if: always()
        run: |
          {
            echo '## فحص المحاكي'
            echo
            if [ -f probe-output.txt ]; then
              echo '```'
              cat probe-output.txt
              echo '```'
            else
              echo 'لم يُنتج ملف المخرجات؛ راجع خطوات المهمة.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish a downloadable build
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified APK bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Safi-Android
          path: release-output
          digest-mismatch: error

      - name: Publish a new prerelease without replacing earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="github-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          NOTES="$RUNNER_TEMP/safi-release-notes.md"
          cat > "$NOTES" <<'NOTES_EOF'
          ## صافي — بناء من المصدر داخل GitHub Actions

          نزّل ملف `Safi-*-github.apk` من Assets وثبّته على أندرويد 8 أو أحدث.
          الملف موقّع بنفس شهادة النسخة الأصلية؛ الروت غير مطلوب ولا يطلب التطبيق صلاحياته.

          هذه نسخة تجريبية. نجح البناء والاختبارات الآلية في GitHub، ونجاح البناء وحده لا يعني أنها اختُبرت على كل هاتف.
          يحجب التطبيق مصادر الإعلانات عبر DNS، ولا يضمن إزالة إعلانات يوتيوب أو إعلانات نفس نطاق المحتوى.
          لا يعمل مع VPN آخر، ولا تفعّل معه «حظر الاتصالات بدون VPN».

          يوجد اختيار لمزوّد DNS المشفّر (Cloudflare افتراضيًا، وأيضًا AdGuard DNS وGoogle)، وقائمة إضافية اختيارية من رابط https،
          وزر في الاختصارات السريعة، ودعم «VPN دائم التشغيل» مع تحذير صريح من خيار حظر الاتصالات بدون VPN.
          لا توجد نتيجة مؤكدة بأن إعلان Passion Drama Lite اختفى.
          يمكن تشغيل فحص DNS بموافقة منفصلة لمدة دقيقتين: حتى 128 سجلًا في ذاكرة الجهاز، وقد يشمل أي تطبيق مفتوح، ولا يُرفع التقرير تلقائيًا.
          حجب شبكة الإعلان قد يمنع أيضًا فتح حلقة تشترط مشاهدة إعلان، ولا يفتحها بداله.

          المستودع عام، فالتنزيل لا يحتاج تسجيل دخول.
          الكود المقابل متاح في ملفات Source code لهذا الوسم، تحت GPL-3.0، بلا ضمان.
          بصمات APK ومعلومات المصدر والتوقيع مرفقة مع الإصدار.
          NOTES_EOF
          printf '\n[سجل البناء والاختبارات](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$NOTES"
          printf '\n[نطاق التحقق في هذا الإصدار](%s/%s/blob/%s/tests/UPDATE-1.2.md)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$NOTES"
          gh release create "$TAG" release-output/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Safi — GitHub build #$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            --prerelease \
            --notes-file "$NOTES"
          printf '## APK جاهز للتنزيل\n\n[فتح الإصدار الجديد](%s/%s/releases/tag/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
