plugins { id 'com.android.application' }
def safiVersion = new Properties()
file('version.properties').withInputStream { safiVersion.load(it) }
android {
    namespace 'app.safi.shield'
    compileSdk 35
    defaultConfig {
        applicationId 'app.safi.shield'
        minSdk 26
        targetSdk 35
        versionCode safiVersion.getProperty('versionCode').toInteger()
        versionName safiVersion.getProperty('versionName')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
